name: Build Android APK

# Manual only: Actions tab -> "Build Android APK" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release = small, optimised; debug = large)"
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restructure flat files into folders
        run: bash restructure.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: gradle ":app:assemble${BUILD_TYPE^}" --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notes-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
